name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Engine-free gameplay tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run tests
        run: dotnet test tools/CoreTests --nologo
